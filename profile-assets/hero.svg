<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Itz_Jagan~! — Kage-inspired temple at night under a vermilion moon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset=".6" stop-color="#0b1219"/>
      <stop offset="1" stop-color="#14202a"/>
    </linearGradient>
    <radialGradient id="moon" cx=".4" cy=".38" r=".8">
      <stop offset="0" stop-color="#ff6a52"/>
      <stop offset=".7" stop-color="#e0231c"/>
      <stop offset="1" stop-color="#9c1511"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e0231c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e0231c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spill" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2ece5"/>
      <stop offset="1" stop-color="#97a89c"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1200" height="440" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#dfe7e0">
    <circle cx="90" cy="40" r="1.1"><animate attributeName="opacity" values=".15;.8;.15" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="95" r="1"><animate attributeName="opacity" values=".7;.1;.7" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="30" r="1.2"><animate attributeName="opacity" values=".2;.9;.2" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="75" r="1"><animate attributeName="opacity" values=".6;.1;.6" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="38" r="1.1"><animate attributeName="opacity" values=".1;.7;.1" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="70" r="1"><animate attributeName="opacity" values=".5;.1;.5" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="150" r="1.2"><animate attributeName="opacity" values=".2;.8;.2" dur="3.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- slow-moving high clouds add depth without competing with the scene -->
  <g fill="none" stroke="#aab4ad" stroke-linecap="round">
    <path d="M-80 175 C30 150 115 165 220 143 C305 126 370 137 465 119" stroke-width="2" opacity=".08">
      <animateTransform attributeName="transform" type="translate" values="-90 0;90 0;-90 0" dur="52s" repeatCount="indefinite"/>
    </path>
    <path d="M710 205 C790 184 865 193 940 170 C1020 146 1095 157 1280 128" stroke-width="3" opacity=".07">
      <animateTransform attributeName="transform" type="translate" values="70 0;-70 0;70 0" dur="64s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- the vermilion moon -->
  <circle cx="930" cy="125" r="170" fill="url(#halo)">
    <animate attributeName="opacity" values=".7;1;.7" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="930" cy="125" r="76" fill="none" stroke="#ff8a4c" stroke-width="1" opacity=".18">
    <animate attributeName="r" values="70;84;70" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".08;.24;.08" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="930" cy="125" r="62" fill="url(#moon)"/>
  <g fill="#7a0f0c" opacity=".28">
    <ellipse cx="910" cy="110" rx="18" ry="12"/>
    <ellipse cx="950" cy="140" rx="14" ry="9"/>
    <ellipse cx="925" cy="150" rx="8" ry="5"/>
  </g>

  <!-- far ridge -->
  <path d="M0 300 C150 250 260 290 380 240 C480 200 540 250 600 230 C700 200 800 262 900 235 C1020 205 1100 270 1200 250 L1200 360 L0 360Z" fill="#070b0f"/>
  <path d="M0 322 C180 292 300 330 460 300 C620 270 760 330 920 305 C1040 285 1120 318 1200 306 L1200 360 L0 360Z" fill="#05080b"/>

  <!-- layered pine silhouettes frame the distant temple -->
  <g fill="#060a0d">
    <path d="M48 350 L76 283 L91 313 L110 264 L132 313 L150 279 L177 350Z"/>
    <path d="M1040 350 L1068 292 L1084 318 L1105 265 L1125 315 L1145 284 L1182 350Z"/>
    <path d="M300 350 L319 310 L333 326 L347 292 L366 328 L380 308 L400 350Z" opacity=".7"/>
  </g>

  <!-- temple glow -->
  <ellipse cx="600" cy="320" rx="260" ry="60" fill="url(#spill)">
    <animate attributeName="opacity" values=".7;1;.75" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- the Sanmon -->
  <g fill="#0b1013">
    <rect x="430" y="318" width="340" height="14"/>
    <rect x="470" y="276" width="260" height="42"/>
    <rect x="510" y="220" width="180" height="32"/>
    <path d="M410 276 C440 272 470 262 500 252 L700 252 C730 262 760 272 790 276 C740 270 660 268 600 268 C540 268 460 270 410 276Z"/>
    <path d="M480 220 C515 216 545 204 565 190 L635 190 C655 204 685 216 720 220 C680 214 640 212 600 212 C560 212 520 214 480 220Z"/>
    <rect x="575" y="184" width="50" height="6"/>
    <polygon points="520,345 680,345 640,318 560,318" fill="#10171b"/>
  </g>
  <!-- lit paper screens -->
  <g fill="#ff9a3a">
    <rect x="500" y="284" width="18" height="24"><animate attributeName="opacity" values=".85;1;.8;.95" dur="3.1s" repeatCount="indefinite"/></rect>
    <rect x="545" y="284" width="18" height="24"><animate attributeName="opacity" values="1;.8;.95;.85" dur="2.7s" repeatCount="indefinite"/></rect>
    <rect x="591" y="284" width="18" height="24"><animate attributeName="opacity" values=".9;1;.85;1" dur="3.6s" repeatCount="indefinite"/></rect>
    <rect x="637" y="284" width="18" height="24"><animate attributeName="opacity" values=".8;.95;1;.85" dur="2.9s" repeatCount="indefinite"/></rect>
    <rect x="682" y="284" width="18" height="24"><animate attributeName="opacity" values="1;.85;.9;1" dur="3.3s" repeatCount="indefinite"/></rect>
    <rect x="551" y="226" width="14" height="16" opacity=".8"><animate attributeName="opacity" values=".6;.95;.7" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="578" y="226" width="14" height="16" opacity=".8"><animate attributeName="opacity" values=".95;.6;.85" dur="3.4s" repeatCount="indefinite"/></rect>
    <rect x="605" y="226" width="14" height="16" opacity=".8"><animate attributeName="opacity" values=".7;.95;.65" dur="4.6s" repeatCount="indefinite"/></rect>
    <rect x="632" y="226" width="14" height="16" opacity=".8"><animate attributeName="opacity" values=".9;.65;.95" dur="3.8s" repeatCount="indefinite"/></rect>
  </g>

  <!-- ground -->
  <rect y="345" width="1200" height="95" fill="#06090c"/>
  <rect y="345" width="1200" height="1" fill="#dfe7e0" opacity=".08"/>
  <path d="M430 345 C495 365 535 377 600 382 C665 377 705 365 770 345" fill="none" stroke="#ff8a4c" stroke-width="1" opacity=".12"/>

  <!-- torii -->
  <g fill="#e0231c" opacity=".92">
    <rect x="150" y="238" width="11" height="110"/>
    <rect x="236" y="238" width="11" height="110"/>
    <rect x="138" y="262" width="121" height="9"/>
    <path d="M120 238 C150 236 170 232 198 226 C226 232 246 236 276 238 L272 222 C240 224 220 218 198 210 C176 218 156 224 124 222Z"/>
    <rect x="193" y="226" width="10" height="16"/>
  </g>

  <!-- stone lantern glow -->
  <g>
    <circle cx="350" cy="330" r="22" fill="url(#spill)"><animate attributeName="opacity" values=".6;1;.5;.9" dur="2.4s" repeatCount="indefinite"/></circle>
    <rect x="346" y="316" width="8" height="12" fill="#ff9a3a"><animate attributeName="opacity" values=".7;1;.6;.95" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="344" y="328" width="12" height="18" fill="#0b1013"/>
    <path d="M338 316 L362 316 L350 304Z" fill="#0b1013"/>
  </g>

  <!-- rising embers -->
  <g fill="#ff8a4c">
    <circle cx="470" cy="330" r="1.6"><animate attributeName="cy" values="335;120" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="335" r="1.2"><animate attributeName="cy" values="335;140" dur="9s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="9s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="335" r="1.8"><animate attributeName="cy" values="335;100" dur="8s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="8s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="335" r="1.3"><animate attributeName="cy" values="335;150" dur="10s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="10s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="335" r="1.5"><animate attributeName="cy" values="335;110" dur="7.5s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="7.5s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="352" cy="318" r="1.4"><animate attributeName="cy" values="318;160" dur="6s" begin=".5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="6s" begin=".5s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="335" r="1.1"><animate attributeName="cy" values="335;90" dur="11s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="11s" begin="5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- falling maple leaves -->
  <g fill="#a3140f">
    <g><animateTransform attributeName="transform" type="translate" values="820,-20; 880,460" dur="14s" repeatCount="indefinite"/>
      <path d="M0 -6 L3 -2 L7 -3 L4 1 L6 6 L0 3 L-6 6 L-4 1 L-7 -3 L-3 -2Z"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="5s" repeatCount="indefinite"/></path></g>
    <g><animateTransform attributeName="transform" type="translate" values="1010,-20; 960,460" dur="17s" begin="3s" repeatCount="indefinite"/>
      <path d="M0 -6 L3 -2 L7 -3 L4 1 L6 6 L0 3 L-6 6 L-4 1 L-7 -3 L-3 -2Z"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="6s" repeatCount="indefinite"/></path></g>
    <g><animateTransform attributeName="transform" type="translate" values="1120,-20; 1090,460" dur="15s" begin="6s" repeatCount="indefinite"/>
      <path d="M0 -6 L3 -2 L7 -3 L4 1 L6 6 L0 3 L-6 6 L-4 1 L-7 -3 L-3 -2Z"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="4.5s" repeatCount="indefinite"/></path></g>
    <g><animateTransform attributeName="transform" type="translate" values="730,-20; 790,460" dur="18s" begin="2s" repeatCount="indefinite"/>
      <path d="M0 -6 L3 -2 L7 -3 L4 1 L6 6 L0 3 L-6 6 L-4 1 L-7 -3 L-3 -2Z"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="7s" repeatCount="indefinite"/></path></g>
    <g><animateTransform attributeName="transform" type="translate" values="300,-20; 350,460" dur="16s" begin="8s" repeatCount="indefinite"/>
      <path d="M0 -6 L3 -2 L7 -3 L4 1 L6 6 L0 3 L-6 6 L-4 1 L-7 -3 L-3 -2Z"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="5.5s" repeatCount="indefinite"/></path></g>
  </g>

  <!-- copy -->
  <g font-family="Onest, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
    <circle cx="62" cy="52" r="3" fill="#e0231c"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="76" y="56" font-size="11" letter-spacing="3.2" fill="#aab4ad">CHAPTER 00 — THE HIDDEN GATE</text>
    <text x="60" y="108" font-size="30" letter-spacing="-0.4" fill="#dfe7e0" font-weight="400">WHERE STILLNESS</text>
    <text x="60" y="144" font-size="30" letter-spacing="-0.4" fill="#dfe7e0" font-weight="400">REVEALS THE UNSEEN.</text>
    <text x="60" y="176" font-size="14" fill="#78837c" font-weight="300">Developer · Building real-world projects</text>
  </g>

  <!-- fade into the page -->
  <rect y="340" width="1200" height="100" fill="url(#fade)"/>

  <!-- wordmark -->
  <text x="60" y="412" font-family="Onest, 'Segoe UI', system-ui, sans-serif" font-size="62" font-weight="600" letter-spacing="9" fill="url(#word)">ITZ_JAGAN~!</text>
  <text x="1140" y="60" font-family="'Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-size="30" fill="#dfe7e0" opacity=".6" letter-spacing="6" style="writing-mode:vertical-rl" text-anchor="start">影の道</text>
</svg>